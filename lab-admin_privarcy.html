<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Admin - NCB-LAB</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #ffffff;">
  <!-- 관리자 전용 깔끔한 네비게이션 헤더 (흰색 배경 버그 원천 차단) -->
  <header class="navbar subpage-nav" style="background-color: #070d19 !important; position: relative !important;">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-mark"></div>
        <div class="logo-text">
          <span class="logo-title"></span>
          <span class="logo-desc"></span>
        </div>
      </a>
      
      <!-- 데스크탑 우측 버튼 그룹 -->
      <div class="admin-top-actions" style="display: flex; align-items: center; gap: 12px;">
        <a href="index.html" class="btn-secondary" style="padding: 8px 16px; font-size: 0.85rem; text-decoration: none; border-radius: 6px;">홈페이지로 가기 &rarr;</a>
        <button id="adminLogoutBtn" class="btn-primary" style="display: none; background: #ef4444; border: none; padding: 8px 16px; font-size: 0.85rem; border-radius: 6px; cursor: pointer; color: #ffffff; font-weight: 700;">로그아웃</button>
      </div>

      <!-- 모바일 햄버거 토글 버튼 -->
      <button class="mobile-menu-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
    </div>

    <!-- 모바일 전용 슬라이드 메뉴 -->
    <nav class="admin-mobile-menu" style="display: none;">
      <div class="nav-item">
        <a href="index.html" class="main-link">홈페이지로 가기</a>
      </div>
      <div class="nav-item" id="adminMobileLogoutItem" style="display: none;">
        <a href="#" id="adminLogoutLinkMobile" class="main-link" style="color: #ef4444 !important;">로그아웃</a>
      </div>
    </nav>
  </header>
  <div class="mobile-backdrop"></div>

  <main class="page-body" style="padding-top: 60px; padding-bottom: 80px;">
    <div class="subpage-header">
      <h1 class="subpage-title">Admin Management</h1>
    </div>

    <!-- 1. 관리자 로그인 인증 박스 -->
    <div id="adminAuthBox" style="max-width: 480px; margin: 40px auto; background: #fff; padding: 36px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
      <form id="adminLoginForm" class="admin-login-form">
        <div class="form-group" style="text-align: center; margin-bottom: 20px;">
          <h3 style="font-size: 1.2rem; font-weight: 800; color: #0f172a; margin-bottom: 6px;">관리자 인증</h3>
          <p style="font-size: 0.84rem; color: #64748b; margin-bottom: 20px;">연구실 콘텐츠를 관리하려면 관리자 계정 정보를 입력하세요.</p>
          
          <div style="text-align: left; margin-bottom: 14px;">
            <label style="font-size: 0.8rem; font-weight: 700; color: #475569; display: block; margin-bottom: 6px;">관리자 이메일</label>
            <input type="email" id="adminEmailInput" placeholder="이메일을 입력하세요" required style="width: 100%; height: 42px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; background: #fff; color: #111827;" />
          </div>

          <div style="text-align: left; margin-bottom: 6px;">
            <label style="font-size: 0.8rem; font-weight: 700; color: #475569; display: block; margin-bottom: 6px;">비밀번호</label>
            <input type="password" id="adminPasswordInput" placeholder="비밀번호 입력" required style="width: 100%; height: 42px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; background: #fff; color: #111827;" />
          </div>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem; font-weight: 700; border-radius: 6px; cursor: pointer; border: none;">관리자 로그인</button>
      </form>
    </div>

    <!-- 2. 관리자 대시보드 패널 (로그인 성공 시 노출) -->
    <div id="adminPanelBox" style="display: none; max-width: 1200px; margin: 0 auto; background: #fff; padding: 36px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
      <div class="admin-nav-tabs" style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px;">
        <button type="button" class="admin-tab-btn active" data-tab="tabHome">Home 제어</button>
        <button type="button" class="admin-tab-btn" data-tab="tabDirector">Director</button>
        <button type="button" class="admin-tab-btn" data-tab="tabMembers">Members</button>
        <button type="button" class="admin-tab-btn" data-tab="tabPubs">Publications</button>
        <button type="button" class="admin-tab-btn" data-tab="tabLabLife">Lab Life</button>
        <button type="button" class="admin-tab-btn" data-tab="tabNotices">Notice</button>
        <button type="button" class="admin-tab-btn" data-tab="tabNews">News</button>
      </div>

      <!-- 탭 컨텐츠 영역들 -->
      <div id="tabHome" class="admin-tab-content active">
        <div class="admin-form-card">
          <h3 class="admin-card-title">Home 히어로 배너 관리</h3>
          <form id="formAdminHomeHero">
            <div class="form-group"><label>상단 뱃지 텍스트</label><input type="text" id="admHomeBadge" /></div>
            <div class="form-group"><label>메인 대제목</label><input type="text" id="admHomeTitle" /></div>
            <div class="form-group"><label>서브 소개 문구</label><textarea id="admHomeDesc" class="admin-textarea" rows="3"></textarea></div>
            <button type="submit" class="btn-primary" style="padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700;">히어로 배너 저장</button>
          </form>
        </div>
      </div>
      <div id="tabDirector" class="admin-tab-content"><div class="admin-form-card"><h3 class="admin-card-title">Director 프로필 및 CV 관리</h3><form id="formAdminDirector"><div class="form-row-2"><div class="form-group"><label>한국어 이름</label><input type="text" id="admDirNameKo" /></div><div class="form-group"><label>영문 이름</label><input type="text" id="admDirNameEn" /></div></div><div class="form-group"><label>직함 (Position)</label><input type="text" id="admDirPosition" /></div><div class="form-row-2"><div class="form-group"><label>이메일</label><input type="email" id="admDirEmail" /></div><div class="form-group"><label>전화번호</label><input type="text" id="admDirTel" /></div></div><div class="form-group"><label>연구실 위치 (Office)</label><input type="text" id="admDirOffice" /></div><div class="form-group"><label>프로필 사진 파일</label><input type="file" id="admDirImg" accept="image/*" /></div><div class="form-group"><label>인사말 및 소개</label><textarea id="admDirGreeting" class="admin-textarea" rows="4"></textarea></div><button type="submit" class="btn-primary" style="padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:700;">Director 정보 저장</button></form></div></div>
      <div id="tabMembers" class="admin-tab-content"><div class="admin-form-card"><h3 class="admin-card-title">Current & Alumni 멤버 관리</h3><form id="formAdminCurrent"><input type="hidden" id="admCurRole" value="Postdoctoral Researcher"><div class="form-row-2"><div class="form-group"><label>이름</label><input type="text" id="admCurName" required></div><div class="form-group"><label>이메일</label><input type="email" id="admCurEmail" required></div></div><div class="form-group"><label>태그 (쉼표로 구분)</label><input type="text" id="admCurTags"></div><div class="form-group"><label>프로필 사진</label><input type="file" id="admCurImg" accept="image/*"></div><button type="submit" class="btn-primary" style="padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:700;">연구원 추가하기</button></form><div style="margin-top:25px;"><table class="board-table"><thead><tr><th>역할</th><th>이름</th><th>태그</th><th style="text-align:center;">관리</th></tr></thead><tbody id="tableBodyCurrent"></tbody></table></div></div></div>
      <div id="tabPubs" class="admin-tab-content"><div class="admin-form-card"><h3 class="admin-card-title">Publications & Patents 관리</h3><form id="formAdminPub"><div class="form-row-2"><div class="form-group"><label>구분</label><select id="admPubType" class="admin-select"><option value="paper">Paper (논문)</option><option value="patent">Patent (특허)</option></select></div><div class="form-group"><label>발행일 (예: 2026.03)</label><input type="text" id="admPubYear"></div></div><div class="form-group"><label>제목</label><input type="text" id="admPubTitle" required></div><div class="form-group"><label>저자 목록</label><input type="text" id="admPubAuthors" required></div><div class="form-row-2"><div class="form-group"><label>저널 / 출처</label><input type="text" id="admPubJournal" required></div><div class="form-group"><label>상세 링크 URL</label><input type="text" id="admPubLink"></div></div><button type="submit" class="btn-primary" style="padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:700;">등록하기</button></form><div style="margin-top:25px;"><table class="board-table"><thead><tr><th style="width:80px; text-align:center;">유형</th><th>제목 및 저자</th><th style="width:100px; text-align:center;">연도</th><th style="width:120px; text-align:center;">관리</th></tr></thead><tbody id="tableBodyPub"></tbody></table></div></div></div>
      <div id="tabLabLife" class="admin-tab-content"><div class="admin-form-card"><h3 class="admin-card-title">Lab Life 활동 관리</h3><form id="formAdminLabLife"><div class="form-row-2"><div class="form-group"><label>날짜 (예: 2026.03.14)</label><input type="text" id="admLifeDate"></div><div class="form-group"><label>제목</label><input type="text" id="admLifeTitle" required></div></div><div class="form-group"><label>내용</label><textarea id="admLifeDesc" class="admin-textarea" rows="4"></textarea></div><div class="form-group"><label>사진 첨부 (다중 선택 가능)</label><input type="file" id="admLifeImgs" accept="image/*" multiple></div><button type="submit" class="btn-primary" style="padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:700;">활동 등록하기</button></form><div style="margin-top:25px;"><table class="board-table"><thead><tr><th style="width:120px; text-align:center;">날짜</th><th>제목</th><th style="width:120px; text-align:center;">관리</th></tr></thead><tbody id="tableBodyLabLife"></tbody></table></div></div></div>
      <div id="tabNotices" class="admin-tab-content"><div class="admin-form-card"><h3 class="admin-card-title">Notice 공지사항 관리</h3><form id="formAdminNotice"><div class="form-row-2"><div class="form-group"><label>날짜</label><input type="text" id="admNotDate"></div><div class="form-group"><label>제목</label><input type="text" id="admNotTitle" required></div></div><div class="form-group"><label>내용</label><textarea id="admNotDesc" class="admin-textarea" rows="4"></textarea></div><div class="form-group"><label>사진 첨부</label><input type="file" id="admNotImgs" accept="image/*" multiple></div><button type="submit" class="btn-primary" style="padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:700;">공지 등록하기</button></form><div style="margin-top:25px;"><table class="board-table"><thead><tr><th style="width:120px; text-align:center;">날짜</th><th>제목</th><th style="width:120px; text-align:center;">관리</th></tr></thead><tbody id="tableBodyNotice"></tbody></table></div></div></div>
      <div id="tabNews" class="admin-tab-content"><div class="admin-form-card"><h3 class="admin-card-title">News 소식 관리</h3><form id="formAdminNews"><div class="form-row-2"><div class="form-group"><label>날짜</label><input type="text" id="admNewsDate"></div><div class="form-group"><label>제목</label><input type="text" id="admNewsTitle" required></div></div><div class="form-group"><label>내용</label><textarea id="admNewsDesc" class="admin-textarea" rows="4"></textarea></div><div class="form-group"><label>사진 첨부</label><input type="file" id="admNewsImgs" accept="image/*" multiple></div><button type="submit" class="btn-primary" style="padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:700;">뉴스 게시하기</button></form><div style="margin-top:25px;"><table class="board-table"><thead><tr><th style="width:120px; text-align:center;">날짜</th><th>제목</th><th style="width:120px; text-align:center;">관리</th></tr></thead><tbody id="tableBodyNews"></tbody></table></div></div></div>
    </div>
  </main>

  <footer class="custom-lab-footer">
    <div class="footer-wrap">
      <div class="footer-grid">
        <div class="footer-col footer-col-brand">
          <div class="footer-brand-header">
            <div class="logo-mark"></div>
            <div>
              <h4 class="footer-brand-title"></h4>
              <p class="footer-brand-sub"></p>
            </div>
          </div>
          <span>E-MAIL. sooya1105@naver.com</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
